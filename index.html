<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>MyWorkout</title><style>:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--text:#f8fafc;--muted:#94a3b8;--blue:#38bdf8;--green:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;padding:16px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}.app{max-width:720px;margin:auto}h1{font-size:25px;margin:5px 0}h2{font-size:18px;margin:0 0 12px}.sub,.muted{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grow{flex:1}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button.active{background:#0369a1;border-color:var(--blue)}button,input,select{font:inherit;border-radius:10px;border:1px solid #475569;background:#0f172a;color:var(--text);padding:11px}button{cursor:pointer;font-weight:700}button.good{background:#166534}button.danger{background:#7f1d1d}button.small{padding:7px 10px;font-size:13px}.exercise{border-top:1px solid var(--line);padding:13px 0}.exercise:first-child{border-top:0}.exname{font-weight:800;font-size:17px}.badge{font-size:12px;background:#334155;padding:4px 8px;border-radius:999px}.suggest{color:#86efac}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.inputs label{font-size:12px;color:var(--muted)}.inputs input{width:100%;margin-top:4px}.history{font-size:13px}.hist{border-top:1px solid var(--line);padding:9px 0}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none}canvas{width:100%;height:180px;background:#0b1220;border-radius:10px}.timer{font-size:42px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:5px}.timer.running{color:#7dd3fc}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#020617;border:1px solid #475569;padding:10px 15px;border-radius:10px;display:none;z-index:10}</style></head><body><div class="app"><h1>MyWorkout</h1><div class="sub">自分専用・重い日 / 軽い日トレーニング</div><div class="card"><h2>今日のモード</h2><div class="mode"><button id="heavyBtn" onclick="setMode('heavy')">重い日<br><span class="muted">5回・休憩3分</span></button><button id="lightBtn" onclick="setMode('light')">軽い日<br><span class="muted">15回・休憩3分</span></button></div></div><div class="card"><div class="row"><h2 class="grow">休憩タイマー</h2><span id="timerMode" class="badge"></span></div><div id="timerDisplay" class="timer">03:00</div><div class="row"><button class="grow" onclick="toggleTimer()" id="timerBtn">開始</button><button onclick="resetTimer()">リセット</button><button onclick="addTimer(30)">＋30秒</button><button onclick="addTimer(-30)">−30秒</button></div><div class="muted">「記録」を押すと自動開始。終了時に音とバイブで知らせます。</div></div><div class="card"><div class="row"><h2 class="grow">今日のトレーニング</h2><button class="small" onclick="showAdd()">＋ 種目追加</button></div><div id="addBox" class="hidden"><div class="row"><input id="newName" class="grow" placeholder="種目名"><input id="newStep" type="number" step="0.5" value="2.5" style="width:90px"><button onclick="addExercise()">追加</button></div><div class="muted">増量幅も設定できます（例 2.5 kg）</div></div><div id="exerciseList"></div></div><div class="card"><div class="row"><h2 class="grow">推移</h2><select id="chartExercise" onchange="drawChart()"></select></div><canvas id="chart" width="650" height="180"></canvas></div><div class="card"><div class="row"><h2 class="grow">データ</h2><button class="small" onclick="exportData()">バックアップ</button><button class="small" onclick="document.getElementById('importFile').click()">復元</button><input class="hidden" id="importFile" type="file" accept="application/json" onchange="importData(event)"></div><div class="muted">端末変更やSafariのデータ消去に備えてJSONで保存できます。</div></div></div><div id="toast" class="toast"></div><script>
const KEY='myWorkout_v1';let memory=null;function load(){try{const x=localStorage.getItem(KEY);return x?JSON.parse(x):null}catch(e){return memory}}function save(){memory=state;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}const defaults=[{id:'press',name:'ダンベルプレス',step:2},{id:'row',name:'オーバーベントロー',step:2},{id:'squat',name:'スクワット',step:2.5}];let state=load()||{mode:'heavy',exercises:defaults,logs:[],drafts:{}};state.drafts=state.drafts||{};let timerId=null,timerEnd=0,timerLeft=180;
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1500)}function targetReps(){return state.mode==='heavy'?5:15}function restSeconds(){return 180}function key(id){return id+'_'+state.mode}function setMode(m){state.mode=m;save();resetTimer();render()}function showAdd(){document.getElementById('addBox').classList.toggle('hidden')}function latest(id,mode=state.mode){return state.logs.filter(x=>x.exerciseId===id&&x.mode===mode).sort((a,b)=>b.time-a.time)[0]||null}function draftFor(ex){const d=state.drafts[key(ex.id)];if(d)return d;const l=latest(ex.id);return l?{weight:l.weight,reps:targetReps()}:{weight:'',reps:targetReps()}}function suggest(ex){const l=latest(ex.id);if(!l)return null;return l.reps>=targetReps()?Number(l.weight)+Number(ex.step||2.5):Number(l.weight)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('heavyBtn').classList.toggle('active',state.mode==='heavy');document.getElementById('lightBtn').classList.toggle('active',state.mode==='light');document.getElementById('timerMode').textContent='休憩：3分';const list=document.getElementById('exerciseList');list.innerHTML='';state.exercises.forEach(ex=>{const d=draftFor(ex),l=latest(ex.id),s=suggest(ex),div=document.createElement('div');div.className='exercise';div.innerHTML=`<div class="row"><div class="exname grow">${esc(ex.name)}</div><span class="badge">${targetReps()}回</span><button class="small" onclick="moveEx('${ex.id}',-1)">↑</button><button class="small" onclick="moveEx('${ex.id}',1)">↓</button><button class="small danger" onclick="removeEx('${ex.id}')">削除</button></div>${l?`<div class="muted">前回：<b>${l.weight} kg × ${l.reps}回</b></div>`:'<div class="muted">前回記録なし</div>'}${s!==null?`<div class="suggest">次回提案：<b>${s} kg × ${targetReps()}回</b> <button class="small" onclick="useSuggestion('${ex.id}',${s})">使う</button></div>`:''}<div class="inputs"><label>今日の重量<input id="w_${ex.id}" type="number" step="0.5" value="${d.weight}" oninput="remember('${ex.id}')"></label><label>実施回数<input id="r_${ex.id}" type="number" min="0" value="${d.reps}" oninput="remember('${ex.id}')"></label></div><div class="toolbar"><button class="good grow" onclick="record('${ex.id}')">✓ 記録 → 休憩開始</button><button class="small" onclick="adjustLast('${ex.id}',-1)">直近 −1回</button><button class="small" onclick="adjustLast('${ex.id}',1)">直近 ＋1回</button></div><div id="h_${ex.id}" class="history"></div>`;list.appendChild(div);renderHistory(ex.id)});renderChartSelect();drawChart();updateTimerDisplay()}
function remember(id){const w=document.getElementById('w_'+id),r=document.getElementById('r_'+id);if(w&&r){state.drafts[key(id)]={weight:w.value,reps:r.value};save()}}function useSuggestion(id,w){state.drafts[key(id)]={weight:w,reps:targetReps()};save();render()}function record(id){remember(id);const d=state.drafts[key(id)],w=Number(d.weight),r=Number(d.reps);if(!w||r<0||!Number.isFinite(r)){toast('重量と回数を確認してください');return}state.logs.push({id:Date.now()+'_'+Math.random(),exerciseId:id,mode:state.mode,weight:w,reps:r,time:Date.now()});state.drafts[key(id)]={weight:w,reps:targetReps()};save();render();startTimer(true);toast('記録しました・休憩開始')}
function adjustLast(id,n){const l=latest(id);if(!l){toast('記録がありません');return}l.reps=Math.max(0,Number(l.reps)+n);save();render();toast('回数を修正しました')}function renderHistory(id){const el=document.getElementById('h_'+id),a=state.logs.filter(x=>x.exerciseId===id).sort((a,b)=>b.time-a.time).slice(0,3);el.innerHTML=a.map(x=>`<div class="hist"><span class="muted">${new Date(x.time).toLocaleDateString('ja-JP')} ${x.mode==='heavy'?'重':'軽'}</span>　${x.weight} kg × ${x.reps}回 <button class="small" onclick="editLog('${x.id}')">編集</button> <button class="small danger" onclick="deleteLog('${x.id}')">削除</button></div>`).join('')}function editLog(id){const x=state.logs.find(z=>z.id===id);if(!x)return;const w=prompt('重量 (kg)',x.weight);if(w===null)return;const r=prompt('回数',x.reps);if(r===null)return;const nw=Number(w),nr=Number(r);if(!nw||nr<0)return;x.weight=nw;x.reps=nr;save();render();toast('履歴だけ修正しました')}function deleteLog(id){if(!confirm('この記録を削除しますか？'))return;state.logs=state.logs.filter(x=>x.id!==id);save();render()}
function addExercise(){const name=document.getElementById('newName').value.trim(),step=Number(document.getElementById('newStep').value)||2.5;if(!name)return;state.exercises.push({id:'ex_'+Date.now(),name,step});save();render();toast('種目を追加しました')}function removeEx(id){if(!confirm('種目を削除しますか？ 記録データも削除されます。'))return;state.exercises=state.exercises.filter(x=>x.id!==id);state.logs=state.logs.filter(x=>x.exerciseId!==id);save();render()}function moveEx(id,d){const i=state.exercises.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=state.exercises.length)return;[state.exercises[i],state.exercises[j]]=[state.exercises[j],state.exercises[i]];save();render()}
function updateTimerDisplay(){const el=document.getElementById('timerDisplay');if(!el)return;const s=Math.max(0,Math.ceil(timerLeft));el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');el.classList.toggle('running',!!timerId);document.getElementById('timerBtn').textContent=timerId?'一時停止':'開始'}function startTimer(fresh=false){if(timerId)clearInterval(timerId);if(fresh||timerLeft<=0)timerLeft=restSeconds();timerEnd=Date.now()+timerLeft*1000;timerId=setInterval(tickTimer,250);updateTimerDisplay()}function tickTimer(){timerLeft=Math.max(0,(timerEnd-Date.now())/1000);updateTimerDisplay();if(timerLeft<=0){clearInterval(timerId);timerId=null;timerLeft=0;updateTimerDisplay();alarm()}}function toggleTimer(){if(timerId){timerLeft=Math.max(0,(timerEnd-Date.now())/1000);clearInterval(timerId);timerId=null;updateTimerDisplay()}else startTimer(false)}function resetTimer(){if(timerId)clearInterval(timerId);timerId=null;timerLeft=restSeconds();updateTimerDisplay()}function addTimer(n){if(timerId){timerEnd+=n*1000;timerLeft=Math.max(0,(timerEnd-Date.now())/1000);if(timerLeft<=0){clearInterval(timerId);timerId=null}}else timerLeft=Math.max(0,timerLeft+n);updateTimerDisplay()}function alarm(){try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){const a=new AC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.5)}}catch(e){}try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}toast('休憩終了！ 次のセットへ')}
function renderChartSelect(){const s=document.getElementById('chartExercise'),old=s.value;s.innerHTML=state.exercises.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');if(state.exercises.some(x=>x.id===old))s.value=old}function e1rm(w,r){return w*(1+r/30)}function drawChart(){const c=document.getElementById('chart'),ctx=c.getContext('2d'),id=document.getElementById('chartExercise').value,a=state.logs.filter(x=>x.exerciseId===id).sort((a,b)=>a.time-b.time).slice(-30);ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle='#334155';ctx.beginPath();ctx.moveTo(35,10);ctx.lineTo(35,150);ctx.lineTo(640,150);ctx.stroke();if(!a.length){ctx.fillStyle='#94a3b8';ctx.fillText('記録すると推定1RMの推移が表示されます',55,80);return}const vals=a.map(x=>e1rm(x.weight,x.reps)),min=Math.min(...vals)*.95,max=Math.max(...vals)*1.05||1,range=max-min||1;ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>{const x=40+i*(590/Math.max(1,vals.length-1)),y=145-(v-min)/range*125;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#94a3b8';ctx.fillText('推定1RM',40,170)}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MyWorkout-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.exercises)||!Array.isArray(x.logs))throw 0;if(confirm('現在のデータをバックアップ内容で置き換えますか？')){state=x;state.drafts=state.drafts||{};save();resetTimer();render();toast('復元しました')}}catch(e){alert('バックアップファイルを読み込めません')}};rd.readAsText(f);ev.target.value=''}render();resetTimer();</script></body></html>
